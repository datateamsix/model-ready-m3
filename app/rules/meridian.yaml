version: "0.1.0"
target: google_meridian
intelligence_version: "2.0.0"
notes: >
  Extra intelligence metadata is documentary. Runtime remediation_class values
  are unchanged. Future diagnostics live in intelligence_registry.yaml and are
  not loaded by the run coordinator.
rules:
  - id: MR-001
    name: time_format
    severity: ERROR
    remediation_class: AUTO_SAFE
    implementation: implemented
    knowledge_class: MERIDIAN_NORMATIVE
    decision_class: AUTO_SAFE
    source_tier: TIER_1_MERIDIAN_OFFICIAL
    last_verified: "2026-08-16"
    blocks_model_ready: true
    source: https://developers.google.com/meridian/docs/user-guide/supported-data-types-formats

  - id: MR-002
    name: missing_values
    severity: ERROR
    remediation_class: APPROVAL_REQUIRED
    implementation: implemented
    knowledge_class: MERIDIAN_NORMATIVE
    decision_class: APPROVAL_REQUIRED
    source_tier: TIER_1_MERIDIAN_OFFICIAL
    last_verified: "2026-08-16"
    blocks_model_ready: true
    source: https://developers.google.com/meridian/docs/pre-modeling/collect-data
    notes: Media inactivity may permit evidence-backed zero filling; KPI/control missingness must not be silently repaired. Unknown absence is not zero. Imputation is never AUTO_SAFE.

  - id: MR-003
    name: consistent_temporal_grain
    severity: ERROR
    remediation_class: AUTO_SAFE
    implementation: implemented
    knowledge_class: MERIDIAN_NORMATIVE
