name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests scripts
      - name: Contract schema drift
        run: python scripts/export_contracts.py --check
      - name: Unit tests
        run: pytest tests/unit
      - name: Dataset A integration
        run: pytest tests/integration -k "not bigquery"
      - name: Dataset A regression
        run: pytest tests/regression
      - name: Pre-cloud check
        run: python scripts/precloud_check.py
