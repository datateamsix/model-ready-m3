name: frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Check backend contract drift
        run: npm run contracts:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Clerk secret/bundle scan
        # M2-06 security requirement: the Clerk secret key must never reach
        # the client bundle. Next.js only inlines NEXT_PUBLIC_-prefixed env
        # vars into client code, so this is a regression guard, not a
        # routine finding -- it fails the build if that boundary is ever
        # broken (e.g. a secret accidentally threaded through client props).
        run: |
          if grep -rl "sk_test_\|sk_live_" .next/static 2>/dev/null; then
            echo "Clerk secret key value found in client bundle (.next/static) -- failing." >&2
            exit 1
          fi
          echo "No Clerk secret key value in client bundle."
