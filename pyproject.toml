[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-ready-m3"
version = "0.1.0"
description = "ModelReady M3 Agent — autonomous pre-modeling data operations for Google Meridian"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "google-adk",
  "google-cloud-aiplatform",
  "google-cloud-bigquery",
  "google-cloud-storage",
  "pandas>=2.2",
  "pyarrow>=18",
  "db-dtypes>=1.4",
  "pandas-gbq>=0.26",
  "pydantic>=2.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/registry/providers/marketing_advertising_providers.v1.json" = "app/registry/providers/marketing_advertising_providers.v1.json"
"app/rules/meridian.yaml" = "app/rules/meridian.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gcp: live Google Cloud tests skipped when ADC is unavailable",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
